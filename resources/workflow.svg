<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 980" width="1040" height="980" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <title>chubbyphp-framework request/response workflow</title>
  <desc>A PSR-15 middleware pipe: the request travels inwards through the application middlewares to the route request handler, the response travels back outwards and is emitted.</desc>

  <defs>
    <marker id="arrow-req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-res" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#15803d"/>
    </marker>
    <marker id="arrow-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="1040" height="980" fill="#ffffff"/>
  <g transform="translate(40 0)">

  <!-- ============ Client ============ -->
  <rect x="380" y="24" width="200" height="44" rx="22" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="480" y="52" text-anchor="middle" font-weight="600" fill="#0f172a">Client</text>
  <text x="480" y="90" text-anchor="middle" fill="#475569" font-size="12">GET /hello/world</text>

  <!-- ============ Application frame ============ -->
  <rect x="200" y="112" width="560" height="656" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="216" y="138" font-weight="700" fill="#0f172a">Application</text>
  <text x="744" y="138" text-anchor="end" fill="#64748b" font-size="12">PipeMiddleware ( middlewares … )</text>

  <!-- ExceptionMiddleware -->
  <rect x="224" y="156" width="512" height="56" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="480" y="180" text-anchor="middle" font-weight="600" fill="#7f1d1d">ExceptionMiddleware</text>
  <text x="480" y="199" text-anchor="middle" fill="#7f1d1d" font-size="12">catches any Throwable → HttpException → HTML error response</text>

  <!-- UrlGeneratorMiddleware -->
  <rect x="224" y="232" width="512" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="480" y="256" text-anchor="middle" font-weight="600" fill="#1e3a8a">UrlGeneratorMiddleware *</text>
  <text x="480" y="275" text-anchor="middle" fill="#1e3a8a" font-size="12">request → withAttribute('urlGenerator', …)</text>

  <!-- RouteMatcherMiddleware -->
  <rect x="224" y="308" width="512" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="480" y="332" text-anchor="middle" font-weight="600" fill="#1e3a8a">RouteMatcherMiddleware</text>
  <text x="480" y="351" text-anchor="middle" fill="#1e3a8a" font-size="12">RouteMatcher::match() → withAttribute('route', …) + route attributes</text>

  <!-- Middleware* (app) -->
  <rect x="224" y="384" width="512" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="480" y="408" text-anchor="middle" font-weight="600" fill="#334155">Middleware *</text>
  <text x="480" y="427" text-anchor="middle" fill="#64748b" font-size="12">any PSR-15 MiddlewareInterface, e.g. LazyMiddleware, CallbackMiddleware, …</text>

  <!-- RouteRequestHandler frame -->
  <rect x="224" y="460" width="512" height="284" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="240" y="486" font-weight="700" fill="#14532d">RouteRequestHandler **</text>
  <text x="720" y="486" text-anchor="end" fill="#166534" font-size="12">route = request→getAttribute('route')</text>

  <!-- Route frame -->
  <rect x="248" y="504" width="464" height="220" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <text x="264" y="528" font-weight="600" fill="#14532d">Route</text>
  <text x="696" y="528" text-anchor="end" fill="#166534" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">GET /hello/{name:[a-z]+}</text>
  <text x="696" y="546" text-anchor="end" fill="#64748b" font-size="12">PipeMiddleware ( route→getMiddlewares() )</text>

  <!-- Middleware* (route) -->
  <rect x="272" y="564" width="416" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="480" y="588" text-anchor="middle" font-weight="600" fill="#334155">Middleware *</text>
  <text x="480" y="607" text-anchor="middle" fill="#64748b" font-size="12">route specific, runs only for this route</text>

  <!-- RequestHandler -->
  <rect x="272" y="640" width="416" height="56" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="480" y="664" text-anchor="middle" font-weight="600" fill="#14532d">RequestHandler</text>
  <text x="480" y="683" text-anchor="middle" fill="#166534" font-size="12">route→getRequestHandler() builds the Response: "Hello, world"</text>

  <!-- ============ Request arrow (left, downwards) ============ -->
  <g stroke="#1d4ed8" stroke-width="2" fill="none">
    <path d="M380 46 H120 V668 H270" marker-end="url(#arrow-req)"/>
  </g>
  <text x="112" y="120" text-anchor="end" font-weight="700" fill="#1d4ed8">Request</text>
  <text x="112" y="138" text-anchor="end" fill="#1d4ed8" font-size="12">ServerRequestInterface</text>
  <g fill="#1d4ed8" font-size="12" text-anchor="end">
    <text x="112" y="268">+ urlGenerator</text>
    <text x="112" y="344">+ route</text>
    <text x="112" y="362">+ name = "world"</text>
  </g>
  <!-- ticks showing where the request passes through each layer -->
  <g stroke="#1d4ed8" stroke-width="2">
    <line x1="120" y1="184" x2="224" y2="184"/>
    <line x1="120" y1="260" x2="224" y2="260"/>
    <line x1="120" y1="336" x2="224" y2="336"/>
    <line x1="120" y1="412" x2="224" y2="412"/>
    <line x1="120" y1="592" x2="272" y2="592"/>
  </g>

  <!-- ============ Response arrow (right, upwards) ============ -->
  <g stroke="#15803d" stroke-width="2" fill="none">
    <path d="M688 668 H840 V60"/>
    <path d="M840 46 H592" marker-end="url(#arrow-res)"/>
  </g>
  <text x="848" y="120" font-weight="700" fill="#15803d">Response</text>
  <text x="848" y="138" fill="#15803d" font-size="12">ResponseInterface</text>
  <g stroke="#15803d" stroke-width="2">
    <line x1="736" y1="184" x2="840" y2="184"/>
    <line x1="736" y1="260" x2="840" y2="260"/>
    <line x1="736" y1="336" x2="840" y2="336"/>
    <line x1="736" y1="412" x2="840" y2="412"/>
    <line x1="688" y1="592" x2="840" y2="592"/>
  </g>

  <!-- Exception short-circuit -->
  <path d="M770 212 C 790 200, 800 196, 812 190" stroke="#b91c1c" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow-err)"/>
  <text x="848" y="176" fill="#b91c1c" font-size="12">on Throwable:</text>
  <text x="848" y="192" fill="#b91c1c" font-size="12">error Response</text>

  <!-- ============ Emitter ============ -->
    <rect x="380" y="800" width="200" height="44" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="480" y="820" text-anchor="middle" font-weight="600" fill="#0f172a">Emitter</text>
  <text x="480" y="836" text-anchor="middle" fill="#475569" font-size="11">$app->emit($response)</text>
  <path d="M840 680 V 822 H 592" stroke="#15803d" stroke-width="2" fill="none" stroke-dasharray="2 5" marker-end="url(#arrow-res)"/>
  <text x="848" y="826" fill="#15803d" font-size="12">header() + echo body</text>

  <!-- ============ Legend ============ -->
  <g font-size="12" fill="#475569">
    <text x="200" y="890">*  optional – any number of PSR-15 middlewares, in the given order</text>
    <text x="200" y="910">** default request handler, can be overridden via the Application constructor</text>
    <text x="200" y="940" fill="#334155">PipeMiddleware wraps each middleware into a MiddlewareRequestHandler: the request travels inwards, the response travels outwards.</text>
    <line x1="200" y1="962" x2="236" y2="962" stroke="#1d4ed8" stroke-width="2"/>
    <text x="244" y="966">Request</text>
    <line x1="320" y1="962" x2="356" y2="962" stroke="#15803d" stroke-width="2"/>
    <text x="364" y="966">Response</text>
    <line x1="450" y1="962" x2="486" y2="962" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="494" y="966">Exception short-circuit</text>
    <line x1="640" y1="962" x2="676" y2="962" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="684" y="966">Optional</text>
  </g>
  </g>
</svg>
